# --- LoRa PHY stack (native in-tree SX126x driver) ---
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
# The devicetree auto-enables the unused legacy SX126x driver symbol; keep it off.
CONFIG_LORA_SX126X=n
CONFIG_SPI=y
CONFIG_GPIO=y

# --- C++17 with full STL (the RadioMesh core uses std::vector/std::array/std::string) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# --- Heap for std::vector/std::string allocations (tune on-target if needed) ---
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# --- Storage: NVS on the devicetree storage_partition (ZephyrNVSStorage) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Platform services (ZephyrPlatform): chip id and entropy ---
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_PRINTK=y
# USB-JTAG drops console output sent before the host enumerates the port; hold
# the deferred log output back so boot logs survive.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=3000
# The held-back boot burst and the inclusion exchange (Curve25519 + packet dumps
# at RM_LOG_DEBUG) outrun the log thread; with a smaller buffer the oldest
# messages are dropped. Size it to keep both.
CONFIG_LOG_BUFFER_SIZE=32768

# --- Stack sizing (LoRa + STL on the main thread) ---
CONFIG_MAIN_STACK_SIZE=8192

# --- RadioMesh library (zephyr/Kconfig) ---
CONFIG_RADIOMESH=y
