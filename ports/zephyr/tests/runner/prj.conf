# On-board test runner. Same kernel and library configuration as
# examples/standard, except console output (see Logging below).

# --- LoRa PHY stack (native in-tree SX126x driver) ---
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
# The devicetree auto-enables the unused legacy SX126x driver symbol; keep it off.
CONFIG_LORA_SX126X=n
CONFIG_SPI=y
CONFIG_GPIO=y

# --- C++17 with full STL (the RadioMesh core uses std::vector/std::array/std::string) ---
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_CPP_EXCEPTIONS=y

# --- Heap for std::vector/std::string allocations ---
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# --- Storage: NVS on the devicetree storage_partition (ZephyrNVSStorage) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- Platform services (ZephyrPlatform): chip id and entropy ---
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y

# --- Logging ---
# The RadioMesh Logger and Unity both write through printk. With the log
# subsystem off, printk goes straight to the console: test results and library
# logs stay in order and none are dropped (deferred logging buffers printk and
# drops the oldest messages under RM_LOG_VERBOSE).
CONFIG_LOG=n
CONFIG_PRINTK=y

# --- Stack sizing (LoRa + STL on the main thread) ---
CONFIG_MAIN_STACK_SIZE=8192

# --- RadioMesh library (zephyr/Kconfig) ---
CONFIG_RADIOMESH=y
