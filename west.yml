# RadioMesh — Zephyr T2 (application) manifest.
#
# RadioMesh is its own west manifest repo. From the workspace topdir:
#   west init -l <path-to-RadioMesh>
#   west update
# fetches Zephyr + the modules below as SIBLINGS of this repo inside the topdir.
# PlatformIO never reads this file (D3 dual-hat).
#
# Pin `revision` to the Zephyr version whose SDK you have installed.
manifest:
  version: "0.13"

  self:
    path: RadioMesh

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: operatorfoundation
      url-base: https://github.com/OperatorFoundation
    - name: throwtheswitch
      url-base: https://github.com/ThrowTheSwitch

  projects:
    # Crypto library co-compiled with the core. Pinned by SHA (tag 0.4.0) to
    # the same commit the PlatformIO build uses, so both builds compile
    # identical crypto sources. Keep in sync with library.json and
    # pio-config/common.ini.
    - name: crypto
      remote: operatorfoundation
      repo-path: Crypto
      revision: 4a6b190f7b1efd96d024d0f4510498963740b001
      path: modules/lib/crypto
    # Unity test framework for the on-board test runner (ports/zephyr/tests).
    # Pinned by SHA (tag v2.6.1) to the version PlatformIO's unity test
    # framework uses, so both platforms run the suites on the same Unity.
    - name: unity
      remote: throwtheswitch
      repo-path: Unity
      revision: cbcd08fa7de711053a3deec6339ee89cad5d2697
      path: modules/test/unity
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.0
      import:
        # Lean import: only the modules an ESP32-S3 + SX1262 + C++ build needs.
        # If `west update`/`west build` reports a missing module, add its name
        # here. To pull the full Zephyr module set instead, delete name-allowlist.
        name-allowlist:
          - hal_espressif   # ESP32-S3 SoC HAL
          - picolibc        # C library
